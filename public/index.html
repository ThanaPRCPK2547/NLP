<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataArchitect AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0b0c0e;
      color: #e6edf3;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 32px;
    }
    h1 {
      font-size: 22px;
      font-weight: 900;
      color: #00d1ff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 32px;
    }
    .box {
      width: min(720px, 100%);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    textarea {
      width: 100%;
      min-height: 110px;
      padding: 14px;
      background: #14171d;
      border: 1px solid #2d3139;
      border-radius: 8px;
      color: #e6edf3;
      font: inherit;
      font-size: 15px;
      resize: vertical;
      line-height: 1.5;
    }
    textarea:focus { outline: 2px solid rgba(0,209,255,.3); border-color: #00d1ff; }
    button {
      padding: 12px;
      background: #00d1ff;
      color: #031217;
      border: 0;
      border-radius: 8px;
      font-weight: 850;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #answer {
      margin-top: 8px;
      padding: 18px;
      background: #14171d;
      border: 1px solid #2d3139;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.65;
      font-size: 14px;
      min-height: 60px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>DataArchitect AI</h1>
  <div class="box">
    <textarea id="question" maxlength="1500" placeholder="ถามเกี่ยวกับ data engineering เช่น ออกแบบ pipeline รับข้อมูล API รายวัน 1 ล้าน record พร้อม data quality"></textarea>
    <button id="send">ถาม</button>
    <div id="answer"></div>
  </div>

  <script>
    const send = document.getElementById("send");
    const answer = document.getElementById("answer");

    async function ask() {
      const q = document.getElementById("question").value.trim();
      if (!q) return;
      send.disabled = true;
      answer.style.display = "block";
      answer.textContent = "กำลังคิด...";
      try {
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q })
        });
        const data = await res.json();
        answer.textContent = res.ok ? data.markdown : (data.error || "เกิดข้อผิดพลาด");
      } catch (e) {
        answer.textContent = "เชื่อมต่อ API ไม่ได้: " + e.message;
      } finally {
        send.disabled = false;
      }
    }

    send.addEventListener("click", ask);
    document.getElementById("question").addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") ask();
    });
  </script>
</body>
</html>
